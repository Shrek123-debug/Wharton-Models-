[pytest]
testpaths = portfolio_model/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: long-running test (deselected by default in CI smoke runs)
